<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Suodata CampusConnect-tapahtumia ajan, kampuksen ja kiinnostuksen mukaan."><title>Suodata tapahtumia | CampusConnect</title><link rel="stylesheet" href="style.css"></head>
<body><div class="phone"><a class="skip-link" href="#main">Siirry pääsisältöön</a><main id="main">
<div class="filter-head"><a class="close" href="index.html" aria-label="Sulje suodattimet">×</a><h1>Suodata tapahtumia</h1></div>
<form action="index.html"><fieldset><legend>Milloin?</legend><div class="options">
<span class="opt"><input id="today" name="time" type="radio" value="today" checked><label for="today">Tänään</label></span>
<span class="opt"><input id="tomorrow" name="time" type="radio" value="tomorrow"><label for="tomorrow">Huomenna</label></span>
<span class="opt"><input id="week" name="time" type="radio" value="week"><label for="week">Tällä viikolla</label></span></div></fieldset>
<fieldset><legend>Missä?</legend><div class="options">
<span class="opt"><input id="pasila" name="place" type="radio" value="pasila" checked><label for="pasila">Pasila</label></span>
<span class="opt"><input id="malmi" name="place" type="radio" value="malmi"><label for="malmi">Malmi</label></span>
<span class="opt"><input id="porvoo" name="place" type="radio" value="porvoo"><label for="porvoo">Porvoo</label></span></div></fieldset>
<fieldset><legend>Kiinnostus</legend><div class="options">
<span class="opt"><input id="sport" name="interest" type="checkbox" value="sport" checked><label for="sport">Liikunta</label></span>
<span class="opt"><input id="culture" name="interest" type="checkbox" value="culture"><label for="culture">Kulttuuri</label></span>
<span class="opt"><input id="community" name="interest" type="checkbox" value="community"><label for="community">Yhteisöt</label></span></div></fieldset>
<div class="filter-actions"><button class="clear" type="reset">Tyhjennä valinnat</button><button class="btn btn-primary" type="submit">Näytä 3 tapahtumaa</button></div></form></main><nav class="bottom-nav" aria-label="Päänavigaatio">

<a class="nav-link" href="index.html#kalenteri"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5zM8 2v4M16 2v4M8 10h8M8 14h5"></path></svg><span>Kalenteri</span></a>
<a class="nav-link" href="index.html#lisaa"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg><span>Lisää</span></a>
</nav></div></body></html>
